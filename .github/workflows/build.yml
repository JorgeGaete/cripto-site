name: construir y publicar sitio
on:
  schedule:
    - cron: "30 0 * * *"     # después del cierre diario (00:00 UTC)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: guardar cache de datos
        run: |
          git config user.name "site-bot"; git config user.email "site-bot@users.noreply.github.com"
          git add cache && (git diff --cached --quiet || (git commit -m "datos $(date -u +%F)" && git push))
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
